# ---------------------------------------------------------------------------
# GitHub Pages
# ---------------------------------------------------------------------------
# A repository gets one Pages site, so this workflow assembles the whole of
# it in one place:
#
#   /        The Baruch Cafe counter, served from the repository root as before.
#   /saba/   Saba Fine Dine — a page about the product, the documentation, and
#            a demonstration of it that runs entirely in the visitor's browser.
#
# What is published is a demonstration, not a till. Saba itself is a small
# server with a database on the restaurant's own computer; it is installed
# with `saba-pos/install.sh` and needs nothing from this website. See
# saba-pos/docs/DEPLOYMENT.md.
#
# Two jobs on purpose. The site is built and checked on every branch, so a
# change that breaks it is caught in the pull request; only the default
# branch publishes, because that is the one the `github-pages` environment
# accepts deployments from.
# ---------------------------------------------------------------------------

name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      # The demonstration runs the product's own code, and the suite includes
      # the parity tests that hold the two to the same figures. If that fails
      # the demonstration must not ship.
      - name: Test Saba
        working-directory: saba-pos
        run: node tests/all.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          # The existing counter app: the repository root, minus everything
          # that is source rather than site. tar rather than rsync, so the
          # same two lines also run on a developer's machine.
          tar -cf - \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./_site \
            --exclude=./data \
            --exclude=./node_modules \
            --exclude=./saba-pos \
            --exclude=./saba-demo \
            --exclude='*.zip' \
            . | tar -xf - -C _site
          # Saba: the page, the rendered documentation, and the demonstration.
          node saba-pos/tools/build-site.mjs "$PWD/_site/saba"
          touch _site/.nojekyll

      - name: Check the site came out whole
        run: |
          for path in index.html saba/index.html saba/demo/index.html \
                      saba/demo/src/demo.js saba/demo/styles/app.css \
                      saba/docs/DEPLOYMENT.html; do
            test -s "_site/$path" || { echo "missing or empty: $path"; exit 1; }
          done
          echo "site assembled:"
          du -sh _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Only the default branch publishes: the `github-pages` environment refuses
  # deployments from anywhere else, and a job that cannot run should not be
  # reported as a failure on every feature branch.
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
