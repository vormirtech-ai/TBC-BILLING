# Builds the browser version of Aasma Buildcon CRM and publishes it to GitHub
# Pages. Enable it under Settings → Pages → Source: "GitHub Actions".
#
# Note this only runs when this project sits at the root of its own repository —
# GitHub only reads workflows from .github/workflows at the repository root.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The hosted build never touches Prisma, so the install skips postinstall
      # and stays quick.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check the interface
        run: npx tsc -p tsconfig.web.json --noEmit

      - name: Build the static site
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
