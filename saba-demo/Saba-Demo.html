ltaPaise: 0 },\n    ],\n  },\n};\n\n/**\n * Food cost as a share of menu price, by section of the carte.\n *\n * These are the ratios a head chef actually works to, and they are not the same\n * across a menu: bread and rice carry almost no cost and subsidise the room,\n * a lamb rack carries a great deal, and wine sits somewhere between the two.\n * Giving every dish the same notional margin would make the menu performance\n * report look tidy and say nothing.\n */\nconst COST_RATIO = {\n  mezze: 0.28,\n  tandoor: 0.36,\n  mains: 0.33,\n  rice: 0.17,\n  dessert: 0.23,\n  bar: 0.26,\n  soft: 0.14,\n};\n\n/**\n * A small, stable wobble around the category ratio so no two dishes in a\n * section report an identical margin. Derived from the id, so it is the same\n * on every machine and on every reload.\n */\nfunction costWobble(id) {\n  // FNV-1a with a finalising mix. A plain `hash * 31 + char` is not enough\n  // here: menu ids run t01, t02, t03, so adjacent hashes differ by one and\n  // every dish in a section ends up reporting the same margin.\n  let hash = 2166136261;\n  for (let i = 0; i < id.length; i += 1) {\n    hash ^= id.charCodeAt(i);\n    hash = Math.imul(hash, 16777619);\n  }\n  hash ^= hash >>> 13;\n  hash = Math.imul(hash, 0x5bd1e995);\n  hash ^= hash >>> 15;\n  return (((hash >>> 0) % 1000) / 1000 - 0.5) * 0.12; // ±6 percentage points\n}\n\nconst item = (id, name, category, pricePaise, station, course, opts = {}) => ({\n  id,\n  name,\n  category,\n  pricePaise,\n  station,\n  course,\n  diet: opts.diet || 'VEG',\n  allergens: opts.allergens || [],\n  description: opts.description || '',\n  modifierGroups: opts.mods || [],\n  signature: !!opts.signature,\n  available: true,\n  /** Nominal food cost, used by the margin column in the menu report. */\n  costPaise: opts.costPaise\n    ?? Math.round(pricePaise * ((COST_RATIO[category] ?? 0.3) + costWobble(id))),\n});\n\nexport const MENU_ITEMS = [\n  /* --------------------------------------------------- }),\n  item('s03', 'Mint Lemonade', 'soft', 30000, 'BAR', 'BEVERAGE', { diet: 'VEGAN' }),\n  item('s04', 'Arabic Coffee', 'soft', 26000, 'BAR', 'BEVERAGE', {\n    diet: 'VEGAN', description: 'Cardamom, served with a date',\n  }),\n  item('s05', 'Persian Chai', 'soft', 24000, 'BAR', 'BEVERAGE', { diet: 'VEGAN' }),\n  item('s06', 'Still / Sparkling Water', 'soft', 18000, 'BAR', 'BEVERAGE', { diet: 'VEGAN' }),\n];\n\nexport const itemById = (id) => MENU_ITEMS.find((i) => i.id === id);\n","/** Dates, durations and ids. Everything here is pure and locale-safe. */\n\nexport const pad = (v, n = 2) => String(v).padStart(n, '0');\n\nexport const uid = (prefix = 'id') =>\n  `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;\n\n/* ---------------------------------------------------------------- dates --- */\n\n/** Local calendar day as YYYY-MM-DD. Never use toISOString here: it is UTC. */\nexport function dayKey(date = new Date()) {\n  const d = new Date(date);\n  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\n}\n\nexport function clockTime(ts) {\n  const d = new Date(ts);\n  const hours = d.getHours();\n  const suffix = hours >= 12 ? 'pm' : 'am';\n  // The hour is deliberately not zero-padded: \"9:05 pm\" is how a person reads\n  // a clock, and \"09:05 pm\" looks like a mistake next to a 24-hour field.\n  return `${((hours + 11) % 12) + 1}:${pad(d.getMinutes())} ${suffix}`;\n}\n\nconst MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',\n  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\nconst DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n\nexport function longDate(ts) {\n  const d = new Date(ts);\n  return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;\n}\n\nexport function shortDate(ts) {\n  const d = new Date(ts);\n  return `${pad(d.getDate())} ${MONTHS[d.getMonth()]}`;\n}\n\nexport const stamp = (ts) => `${shortDate(ts)} · ${clockTime(ts)}`;\n\n/* ------------------------------------------------------------ durations --- */\n\n/** Whole minutes between two instants, floored — a 59-second wait is 0m. */\nexport const minutesSince = (from, now = Date.now()) =>\n  Math.max(0, Math.floor((now - from) / 60000));\n\n/** 0 -> \"just now\", 7 -> \"7m\", 95 -> \"1h 35m\". */\nexport function elapsed(from, now = Date.now()) {\n  const mins = minutesSince(from, now);\n  if (mins < 1) return 'just now';\n  if (mins < 60) return `${mins}m`;\n  return `${Math.floor(mins / 60)}h ${pad(mins % 60)}m`;\n}\n\n/** Ticking mm:ss for kitchen dockets, where seconds genuinely matter. */\nexport function timer(from, now = Date.now()) {\n  const secs = Math.max(0, Math.floor((now - from) / 1000));\n  return `${pad(Math.floor(secs / 60))}:${pad(secs % 60)}`;\n}\n\n/* -------------------------------------------------------------- strings --- */\n\nexport const initials = (name) =>\n  String(name || '').trim().split(/\\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase();\n\n/**\n * plural(3, 'cover') -> \"3 covers\".  English being what it is, an irregular\n * plural has to be given: plural(3, 'dish', 'dishes').\n */\nexport const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;\n\n/** Sequence number -> \"SAB-0148\". */\nexport const serial = (prefix, n, width = 4) => `${prefix}-${pad(n, width)}`;\n\n/** Case- and space-insensitive contains, for the menu search box. */\nexport function matches(haystack, needle) {\n  if (!needle) return true;\n  const n = needle.trim().toLowerCase();\n  return String(haystack || '').toLowerCase().includes(n);\n}\n","/**\n * Money is held as whole paise (integers) everywhere in this app, and only ever\n * becomes a decimal string at the moment it is drawn on screen or on paper.\n *\n * This is not pedantry. A bill that adds 0.1 + 0.2 in floating point and then\n * rounds at the end can disagree with the printed line items by a rupee, and a\n * guest who spots that stops trusting the whole system.\n */\n\n/** 1250.5 (rupees) -> 125050 (paise). */\nexport const toPaise = (rupees) => Math.round(Number(rupees || 0) * 100);\n\n/** 125050 -> 1250.5 */\nexport const toRupees = (paise) => Math.round(paise || 0) / 100;\n\n/** Percentage in basis points: pct(50000, 1000) === 5000 (10% of ₹500). */\nexport const pct = (paise, bps) => Math.round((paise * bps) / 10000);\n\n/** Sum with no float drift. */\nexport const sum = (values) => values.reduce((total, v) => total + (v || 0), 0);\n\n/** Nearest whole rupee, and how far it moved. Used for the round-off line. */\nexport function roundToRupee(paise) {\n  const rounded = Math.round(paise / 100) * 100;\n  return { rounded, delta: rounded - paise };\n}\n\n/**\n * Split `paise` into `parts` shares that add back to exactly `paise`. The\n * remainder is spread one paisa at a time over the earliest shares rather than\n * dumped on the last one, so an equal split of ₹100 across 3 guests reads\n * 33.34 / 33.33 / 33.33 and never 33.33 / 33.33 / 33.34.\n */\nexport function splitEvenly(paise, parts) {\n  if (parts < 1) return [];\n  const base = Math.floor(paise / parts);\n  const remainder = paise - base * parts;\n  return Array.from({ length: parts }, (_, i) => base + (i < remainder ? 1 : 0));\n}\n\nlet formatter = null;\nfunction numberFormat(locale) {\n  if (!formatter) {\n    try {\n      formatter = new Intl.NumberFormat(locale, {\n        minimumFractionDigits: 2, maximumFractionDigits: 2,\n      });\n    } catch {\n      formatter = { format: (n) => Number(n).toFixed(2) };\n    }\n  }\n  return formatter;\n}\n\n/** 125050 -> \"1,250.50\" (no symbol; callers place the symbol themselves). */\nexport function amount(paise, locale = 'en-IN') {\n  const value = toRupees(Math.abs(paise || 0));\n  return (paise < 0 ? '-' : '') + numberFormat(locale).format(value);\n}\n\n/** 125050 -> \"₹1,250.50\" */\nexport const money = (paise, symbol = '₹', locale = 'en-IN') =>\n  `${paise < 0 ? '-' : ''}${symbol}${amount(Math.abs(paise || 0), locale)}`;\n\n/**\n * Whole rupees, grouped: 1310594 -> \"₹13,106\". Dashboard tiles use this — two\n * decimal places on a six-figure number is noise, and the paise belong on a\n * bill where somebody is going to hand over the money.\n */\nexport function money0(paise, symbol = '₹', locale = 'en-IN') {\n  const rupees = Math.round((paise || 0) / 100);\n  let grouped;\n  try {\n    grouped = new Intl.NumberFormat(locale, { maximumFractionDigits: 0 }).format(Math.abs(rupees));\n  } catch {\n    grouped = String(Math.abs(rupees));\n  }\n  return `${rupees < 0 ? '-' : ''}${symbol}${grouped}`;\n}\n\n/** Compact form for dashboard tiles: 1284500 -> \"₹12.8K\". */\nexport function compactMoney(paise, symbol = '₹') {\n  const rupees = toRupees(paise);\n  if (Math.abs(rupees) >= 1e7) return `${symbol}${(rupees / 1e7).toFixed(2)}Cr`;\n  if (Math.abs(rupees) >= 1e5) return `${symbol}${(rupees / 1e5).toFixed(2)}L`;\n  if (Math.abs(rupees) >= 1000) return `${symbol}${(rupees / 1000).toFixed(1)}K`;\n  return `${symbol}${Math.round(rupees)}`;\n}\n","/**\n * Bill arithmetic. Pure functions over plain objects — no DOM, no store — so\n * every figure on this page is reproducible and testable (see tests/).\n *\n * The order of operations is the part that people get wrong, and it is the part\n * an auditor checks first:\n *\n *   gross            Σ (unit + modifiers) × qty, voids excluded\n *   − comps          lines the house is giving away, shown but not charged\n *   = net items\n *   − discount       bill-level, on net items only\n *   = discounted\n *   + service charge on the discounted amount\n *   = taxable\n *   + CGST + SGST    each on the taxable amount, never compounded on each other\n *   + tip            after tax; a tip is never taxed\n *   ± round-off      to the nearest rupee\n *   = total\n *\n * Every intermediate figure is whole paise, so the printed lines always add up\n * to the printed total.\n */\n\nimport { CHARGES } from 'saba-module:0';\nimport { pct, roundToRupee, sum, splitEvenly } from 'saba-module:6';\n\n/** What one line actually costs, modifiers included. */\nexport function lineGross(line) {\n  const unit = line.unitPaise + sum((line.modifiers || []).map((m) => m.deltaPaise || 0));\n  return unit * line.qty;\n}\n\n/** Unit price with modifiers folded in — what the bill shows per item. */\nexport function lineUnit(line) {\n  return line.unitPaise + sum((line.modifiers || []).map((m) => m.deltaPaise || 0));\n}\n\nexport const isBillable = (line) => line.status !== 'VOID';\n\n/**\n * Bill-level discount in paise. A percentage discount is taken on the net item\n * value; a flat discount is capped at it so a bill can never go negative.\n */\nexport function discountAmount(netItems, discount) {\n  if (!discount || discount.mode === 'NONE' || !discount.value) return 0;\n  if (discount.mode === 'PCT') {\n    const capped = Math.min(Number(discount.value), CHARGES.maxDiscountPercent);\n    return pct(netItems, Math.round(capped * 100));\n  }\n  return Math.min(Math.round(Number(discount.value) * 100), netItems);\n}\n\n/**\n * Cost the whole bill.\n *\n * @param {object} order\n * @param {object} [opts]\n * @param {string[]} [opts.lineIds] cost only these lines — used by split bills,\n *        where each share is a genuine bill in its own right and carries its own\n *        proportional service charge and tax.\n * @returns a totals object every screen and the printed bill share.\n */\nexport function costOrder(order, opts = {}) {\n  const charges = order.charges || {};\n  const pool = order.lines.filter(isBillable);\n  const lines = opts.lineIds ? pool.filter((l) => opts.lineIds.includes(l.id)) : pool;\n\n  const gross = sum(lines.map(lineGross));\n  const comps = sum(lines.filter((l) => l.comp).map(lineGross));\n  const netItems = gross - comps;\n\n  // A split share carries the same proportion of the bill discount that it\n  // carries of the items, so three shares of one discounted bill still add to\n  // the one discounted total.\n  const wholeNet = sum(pool.map(lineGross)) - sum(pool.filter((l) => l.comp).map(lineGross));\n  const wholeDiscount = discountAmount(wholeNet, charges.discount);\n  const discount = opts.lineIds && wholeNet > 0\n    ? Math.round((wholeDiscount * netItems) / wholeNet)\n    : wholeDiscount;\n\n  const discounted = Math.max(0, netItems - discount);\n\n  const serviceCharge = charges.serviceCharge === false\n    ? 0\n    : pct(discounted, CHARGES.serviceChargeBps);\n\n  const taxable = discounted + serviceCharge;\n  const taxes = CHARGES.taxComponents.map((component) => ({\n    id: component.id,\n    label: component.label,\n    bps: component.bps,\n    paise: pct(taxable, component.bps),\n  }));\n  const taxTotal = sum(taxes.map((t) => t.paise));\n\n  const tip = opts.lineIds ? 0 : (charges.tipPaise || 0);\n  const beforeRounding = taxable + taxTotal + tip;\n  const { rounded, delta } = CHARGES.roundOffEnabled\n    ? roundToRupee(beforeRounding)\n    : { rounded: beforeRounding, delta: 0 };\n\n  const paid = sum((order.payments || [])\n    .filter((p) => !opts.lineIds || p.shareId === opts.shareId)\n    .map((p) => p.paise));\n\n  return {\n    itemCount: sum(lines.map((l) => l.qty)),\n    gross,\n    comps,\n    netItems,\n    discount,\n    discounted,\n    serviceCharge,\n    serviceChargeApplied: charges.serviceCharge !== false,\n    taxable,\n    taxes,\n    taxTotal,\n    tip,\n    roundOff: delta,\n    total: rounded,\n    paid,\n    balance: rounded - paid,\n    lines,\n  };\n}\n\n/* ---------------------------------------------------------------- splits --- */\n\n/**\n * Split a bill into shares. Three ways, because guests ask for all three:\n *\n *  'EQUAL' — n ways down the middle. Only the money is split; the items stay\n *            on one list, because nobody wants \"0.33 of a lamb shank\" printed.\n *  'SEAT'  — one share per seat number, from the seat each item was ordered\n *            against. This is why seat numbering exists in the order screen.\n *  'ITEM'  — the captain assigns lines to shares by hand.\n */\nexport function buildSplit(order, mode, config = {}) {\n  const lines = order.lines.filter(isBillable);\n\n  if (mode === 'EQUAL') {\n    const ways = Math.max(2, Number(config.ways) || 2);\n    const totals = splitEvenly(costOrder(order).total, ways);\n    return {\n      mode,\n      shares: totals.map((paise, i) => ({\n        id: `s${i + 1}`,\n        label: `Guest ${i + 1}`,\n        lineIds: [],\n        fixedTotal: paise,\n      })),\n    };\n  }\n\n  if (mode === 'SEAT') {\n    const bySeat = new Map();\n    for (const line of lines) {\n      const seat = line.seat || 0;\n      if (!bySeat.has(seat)) bySeat.set(seat, []);\n      bySeat.get(seat).push(line.id);\n    }\n    const seats = [...bySeat.keys()].sort((a, b) => a - b);\n    return {\n      mode,\n      shares: seats.map((seat) => ({\n        id: `seat${seat}`,\n        label: seat ? `Seat ${seat}` : 'Table (shared)',\n        lineIds: bySeat.get(seat),\n      })),\n    };\n  }\n\n  // ITEM: start with everything on share 1 and let the captain drag lines off.\n  const ways = Math.max(2, Number(config.ways) || 2);\n  return {\n    mode,\n    shares: Array.from({ length: ways }, (_, i) => ({\n      id: `s${i + 1}`,\n      label: `Share ${i + 1}`,\n      lineIds: i === 0 ? lines.map((l) => l.id) : [],\n    })),\n  };\n}\n\n/** Cost every share of a split, so the settle screen can show them side by side. */\nexport function costSplit(order, split) {\n  return split.shares.map((share) => {\n    if (share.fixedTotal != null) {\n      const paid = sum((order.payments || [])\n        .filter((p) => p.shareId === share.id).map((p) => p.paise));\n      return {\n        share,\n        totals: { total: share.fixedTotal, paid, balance: share.fixedTotal - paid, lines: [] },\n      };\n    }\n    return {\n      share,\n      totals: costOrder(order, { lineIds: share.lineIds, shareId: share.id }),\n    };\n  });\n}\n","/**\n * Orders, courses and kitchen dockets.\n *\n * The model that makes fine dining different from a counter till:\n *\n *   • A line is written against a COURSE and a SEAT, not just a table. The\n *     kitchen needs the course to pace the meal; the till needs the seat to\n *     split the bill later without the captain re-typing anything.\n *\n *   • A line sits HELD until its course is FIRED. Firing a course is the moment\n *     the kitchen is told to cook, and it is deliberately a separate action\n *     from taking the order — otherwise the mains are plated while the guests\n *     are still on the starters.\n *\n *   • Firing produces one KOT PER STATION. The tandoor's docket must not carry\n *     the dessert line. This is the single most common thing cheap systems get\n *     wrong, and it is why food arrives cold.\n *\n * Every function here is pure: it takes an order and returns a new one, so the\n * store can apply it and the tests can assert on it without a browser.\n */\n\nimport { KOT_STATUS, NUMBERING, stationById, courseById, COURSES } from 'saba-module:0';\nimport { uid, serial } from 'saba-module:5';\nimport { lineGross } from 'saba-module:7';\n\n/* --------------------------------------------------------------- create --- */\n\nexport function createOrder({ number, table, covers, guestName, user, reservationId = null }) {\n  return {\n    id: uid('ord'),\n    number,\n    code: serial(NUMBERING.orderPrefix, number, NUMBERING.padding),\n    tableId: table.id,\n    tableLabel: table.label,\n    sectionId: table.sectionId,\n    covers: Math.max(1, Number(covers) || 2),\n    guestName: guestName || '',\n    reservationId,\n    captainId: user.id,\n    captainName: user.name,\n    openedAt: Date.now(),\n    closedAt: null,\n    status: 'OPEN',\n    lines: [],\n    kots: [],\n    kotSeq: 0,\n    charges: {\n      serviceCharge: true,\n      discount: { mode: 'NONE', value: 0, reason: '', approvedBy: '' },\n      tipPaise: 0,\n    },\n    payments: [],\n    split: null,\n    invoice: null,\n    notes: '',\n  };\n}\n\nexport function createLine(item, { qty = 1, course, seat = null, modifiers = [], notes = '' } = {}) {\n  return {\n    id: uid('ln'),\n    itemId: item.id,\n    name: item.name,\n    station: item.station,\n    course: course || item.course,\n    seat,\n    qty: Math.max(1, Number(qty) || 1),\n    unitPaise: item.pricePaise,\n    modifiers: modifiers.map((m) => ({ id: m.id, label: m.label, deltaPaise: m.deltaPaise || 0 })),\n    notes,\n    status: KOT_STATUS.HELD,\n    kotId: null,\n    comp: false,\n    compReason: '',\n    voidReason: '',\n    voidBy: '',\n    addedAt: Date.now(),\n    firedAt: null,\n    readyAt: null,\n    servedAt: null,\n  };\n}\n\n/* ---------------------------------------------------------------- lines --- */\n\n/**\n * Adding the same item, same course, same seat and same modifiers should bump\n * the quantity instead of stacking identical rows — but only while it is still\n * HELD. Once a line is in the kitchen it is a historical fact and the new one\n * is a genuinely separate order.\n */\nexport function addLine(order, item, options = {}) {\n  const candidate = createLine(item, options);\n  const twin = order.lines.find(\n    (l) => l.status === KOT_STATUS.HELD\n      && l.itemId === candidate.itemId\n      && l.course === candidate.course\n      && l.seat === candidate.seat\n      && l.notes === candidate.notes\n      && sameModifiers(l.modifiers, candidate.modifiers)\n  );\n  if (twin) {\n    twin.qty += candidate.qty;\n    return order;\n  }\n  order.lines.push(candidate);\n  return order;\n}\n\nconst sameModifiers = (a, b) =>\n  a.length === b.length\n  && a.map((m) => m.id).sort().join('|') === b.map((m) => m.id).sort().join('|');\n\nexport function setLineQty(order, lineId, qty) {\n  const line = order.lines.find((l) => l.id === lineId);\n  if (!line) return order;\n  if (line.status !== KOT_STATUS.HELD) return order; // fired food must be voided, not edited\n  if (qty <= 0) order.lines = order.lines.filter((l) => l.id !== lineId);\n  else line.qty = qty;\n  return order;\n}\n\n/** Remove a held line outright; nothing was cooked so nothing needs auditing. */\nexport function removeHeldLine(order, lineId) {\n  order.lines = order.lines.filter((l) => !(l.id === lineId && l.status === KOT_STATUS.HELD));\n  return order;\n}\n\n/**\n * Kill a line that has already reached the kitchen. It stays on the order with\n * a reason and an approver so the void shows up in the day's report — deleting\n * it would hide food that was genuinely cooked and thrown away.\n */\nexport function voidLine(order, lineId, reason, approvedBy) {\n  const line = order.lines.find((l) => l.id === lineId);\n  if (!line || line.status === KOT_STATUS.VOID) return order;\n  line.status = KOT_STATUS.VOID;\n  line.voidReason = reason;\n  line.voidBy = approvedBy;\n  line.voidedAt = Date.now();\n  syncKotStatus(order, line.kotId);\n  return order;\n}\n\nexport function compLine(order, lineId, reason, approvedBy) {\n  const line = order.lines.find((l) => l.id === lineId);\n  if (!line) return order;\n  line.comp = !line.comp;\n  line.compReason = line.comp ? reason : '';\n  line.compBy = line.comp ? approvedBy : '';\n  return order;\n}\n\nexport function moveLineToSeat(order, lineId, seat) {\n  const line = order.lines.find((l) => l.id === lineId);\n  if (line) line.seat = seat;\n  return order;\n}\n\n/* ----------------------------------------------------------------- KOTs --- */\n\nexport const heldLines = (order, courseId = null) =>\n  order.lines.filter(\n    (l) => l.status === KOT_STATUS.HELD && (!courseId || l.course === courseId)\n  );\n\n/** Courses that currently have something waiting to be sent. */\nexport function heldCourses(order) {\n  const ids = new Set(heldLines(order).map((l) => l.course));\n  return COURSES.filter((c) => ids.has(c.id));\n}\n\n/**\n * Send held lines to the kitchen.\n *\n * @param {string|null} courseId  fire one course, or null for everything held\n * @returns {{ order: object, kots: object[] }} the dockets that were created,\n *          so the caller can print them\n */\nexport function fireCourse(order, courseId, user) {\n  const lines = heldLines(order, courseId);\n  if (!lines.length) return { order, kots: [] };\n\n  const byStation = new Map();\n  for (const line of lines) {\n    if (!byStation.has(line.station)) byStation.set(line.station, []);\n    byStation.get(line.station).push(line);\n  }\n\n  const now = Date.now();\n  const created = [];\n  for (const [station, stationLines] of byStation) {\n    order.kotSeq += 1;\n    const kot = {\n      id: uid('kot'),\n      code: `${NUMBERING.kotPrefix}${order.code.split('-')[1]}-${order.kotSeq}`,\n      orderId: order.id,\n      orderCode: order.code,\n      tableLabel: order.tableLabel,\n      covers: order.covers,\n      station,\n      // A docket can hold more than one course only when a captain fires\n      // everything at once; the ticket then prints a course heading per group.\n      courses: [...new Set(stationLines.map((l) => l.course))],\n      lineIds: stationLines.map((l) => l.id),\n      status: KOT_STATUS.FIRED,\n      firedAt: now,\n      firedBy: user?.name || '',\n      readyAt: null,\n      servedAt: null,\n      printCount: 1,\n      voidReason: '',\n    };\n    for (const line of stationLines) {\n      line.status = KOT_STATUS.FIRED;\n      line.kotId = kot.id;\n      line.firedAt = now;\n    }\n    order.kots.push(kot);\n    created.push(kot);\n  }\n\n  return { order, kots: created };\n}\n\n/** Kitchen bumps a docket: FIRED -> READY -> SERVED. */\nexport function advanceKot(order, kotId, to) {\n  const kot = order.kots.find((k) => k.id === kotId);\n  if (!kot || kot.status === KOT_STATUS.VOID) return order;\n  const now = Date.now();\n\n  if (to === KOT_STATUS.READY) { kot.status = to; kot.readyAt = now; }\n  else if (to === KOT_STATUS.SERVED) {\n    kot.status = to;\n    kot.readyAt = kot.readyAt || now;\n    kot.servedAt = now;\n  } else if (to === KOT_STATUS.FIRED) {\n    // Recall from the pass — the runner never took it.\n    kot.status = to; kot.readyAt = null; kot.servedAt = null;\n  }\n\n  for (const line of order.lines) {\n    if (line.kotId !== kotId || line.status === KOT_STATUS.VOID) continue;\n    line.status = kot.status;\n    line.readyAt = kot.readyAt;\n    line.servedAt = kot.servedAt;\n  }\n  return order;\n}\n\nexport function voidKot(order, kotId, reason, approvedBy) {\n  const kot = order.kots.find((k) => k.id === kotId);\n  if (!kot) return order;\n  kot.status = KOT_STATUS.VOID;\n  kot.voidReason = reason;\n  kot.voidBy = approvedBy;\n  kot.voidedAt = Date.now();\n  for (const line of order.lines) {\n    if (line.kotId === kotId) {\n      line.status = KOT_STATUS.VOID;\n      line.voidReason = reason;\n      line.voidBy = approvedBy;\n      line.voidedAt = Date.now();\n    }\n  }\n  return order;\n}\n\nexport function reprintKot(order, kotId) {\n  const kot = order.kots.find((k) => k.id === kotId);\n  if (kot) kot.printCount += 1;\n  return order;\n}\n\n/** After a line is voided its docket may have nothing live left on it. */\nfunction syncKotStatus(order, kotId) {\n  if (!kotId) return;\n  const kot = order.kots.find((k) => k.id === kotId);\n  if (!kot) return;\n  const live = order.lines.filter(\n    (l) => l.kotId === kotId && l.status !== KOT_STATUS.VOID\n  );\n  if (!live.length) kot.status = KOT_STATUS.VOID;\n}\n\nexport const kotLines = (order, kot) =>\n  kot.lineIds.map((id) => order.lines.find((l) => l.id === id)).filter(Boolean);\n\n/* ---------------------------------------------------------- derivations --- */\n\n/**\n * What the floor plan should paint for a table, worked out from the order\n * rather than stored separately — two sources of truth would drift apart the\n * first time a docket was voided.\n */\nexport function orderStage(order) {\n  if (!order) return 'VACANT';\n  if (order.status === 'SETTLED') return 'CLEANING';\n  if (order.invoice) return 'BILLED';\n\n  const live = order.lines.filter((l) => l.status !== KOT_STATUS.VOID);\n  if (!live.length) return 'SEATED';\n  // Nothing has reached a kitchen yet: the captain is still writing. The table\n  // is seated, not waiting on food, and the floor plan should not imply it is.\n  if (live.every((l) => l.status === KOT_STATUS.HELD)) return 'SEATED';\n  if (live.some((l) => l.status === KOT_STATUS.HELD || l.status === KOT_STATUS.FIRED)) {\n    return 'ORDERED';\n  }\n  if (live.every((l) => l.status === KOT_STATUS.SERVED)) return 'SERVED';\n  return 'ORDERED';\n}\n\n/** Course-by-course progress, for the pacing strip on the order screen. */\nexport function coursePacing(order) {\n  return COURSES.map((course) => {\n    const lines = order.lines.filter(\n      (l) => l.course === course.id && l.status !== KOT_STATUS.VOID\n    );\n    if (!lines.length) return { course, state: 'EMPTY', count: 0 };\n    const state = lines.every((l) => l.status === KOT_STATUS.SERVED) ? 'SERVED'\n      : lines.some((l) => l.status === KOT_STATUS.HELD) ? 'HELD'\n        : lines.some((l) => l.status === KOT_STATUS.FIRED) ? 'FIRED' : 'READY';\n    return { course, state, count: lines.reduce((n, l) => n + l.qty, 0) };\n  });\n}\n\n/** Distinct seats used on this order, for the seat picker and seat splits. */\nexport function seatsUsed(order) {\n  const seats = new Set(\n    order.lines.filter((l) => l.seat).map((l) => l.seat)\n  );\n  return [...seats].sort((a, b) => a - b);\n}\n\n/** How long each station took, feeding the kitchen performance report. */\nexport function kotDurations(order) {\n  return order.kots\n    .filter((k) => k.status !== KOT_STATUS.VOID && k.readyAt)\n    .map((k) => ({\n      station: k.station,\n      stationLabel: stationById(k.station).label,\n      minutes: Math.max(0, Math.round((k.readyAt - k.firedAt) / 60000)),\n      sla: stationById(k.station).slaMinutes,\n      firedAt: k.firedAt,\n    }));\n}\n\nexport const orderValue = (order) =>\n  order.lines.filter((l) => l.status !== KOT_STATUS.VOID && !l.comp)\n    .reduce((total, l) => total + lineGross(l), 0);\n\nexport const courseLabel = (id) => courseById(id).label;\n","/**\n * Thirty days of trading behind today, so the reports have something to say the\n * moment the demo opens.\n *\n * Two decisions worth knowing about:\n *\n *  1. The numbers come from a seeded generator, not Math.random. The same day\n *     always produces the same covers and the same top sellers, so a figure a\n *     client notices in the morning is still there in the afternoon.\n *\n *  2. History is rebuilt at boot rather than saved. It is derived data — 30\n *     days of full orders would be most of a megabyte of local storage for\n *     something that never changes.\n */\n\nimport { MENU_ITEMS } from 'saba-module:4';\nimport { CHARGES } from 'saba-module:0';\nimport { pct, roundToRupee } from 'saba-module:6';\nimport { dayKey } from 'saba-module:5';\n\n/** mulberry32 — small, fast, and identical on every machine. */\nexport function rng(seed) {\n  let a = seed >>> 0;\n  return () => {\n    a = (a + 0x6D2B79F5) >>> 0;\n    let t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nconst pick = (random, list) => list[Math.floor(random() * list.length)];\nconst between = (random, lo, hi) => lo + Math.floor(random() * (hi - lo + 1));\n\n/**\n * Service is not flat. Friday and Saturday run about 45% busier than a Tuesday,\n * and the room fills in two waves — an early sitting around 7 and the main one\n * at 9. A report built on an even spread looks fake to anyone who has run a\n * restaurant.\n */\nconst DAY_WEIGHT = [1.15, 0.62, 0.72, 0.84, 0.96, 1.42, 1.48]; // Sun … Sat\nconst HOUR_WEIGHT = {\n  12: 0.5, 13: 0.9, 14: 0.6, 15: 0.2,\n  19: 0.8, 20: 1.3, 21: 1.5, 22: 1.1, 23: 0.4,\n};\n\nconst PAYMENT_MIX = [\n  ['CARD', 0.46], ['UPI', 0.34], ['CASH', 0.12], ['ROOM', 0.05], ['VOUCHER', 0.03],\n];\n\nfunction weightedPayment(random) {\n  let roll = random();\n  for (const [method, share] of PAYMENT_MIX) {\n    roll -= share;\n    if (roll <= 0) return method;\n  }\n  return 'CARD';\n}\n\n/** Fine dining sells differently: signatures carry the room. */\nfunction weightedItem(random, pool) {\n  const item = pick(random, pool);\n  if (item.signature && random() < 0.45) return item;\n  if (!item.signature && random() < 0.22) return pick(random, pool.filter((i) => i.signature));\n  return item;\n}\n\nfunction buildCheck(random, at, covers) {\n  const mezze = MENU_ITEMS.filter((i) => i.category === 'mezze');\n  const bigs = MENU_ITEMS.filter((i) => ['tandoor', 'mains'].includes(i.category));\n  const sides = MENU_ITEMS.filter((i) => i.category === 'rice');\n  const sweets = MENU_ITEMS.filter((i) => i.category === 'dessert');\n  const drinks = MENU_ITEMS.filter((i) => ['bar', 'soft'].includes(i.category));\n\n  const lines = [];\n  const push = (item, qty) => {\n    if (!item) return;\n    const found = lines.find((l) => l.itemId === item.id);\n    if (found) found.qty += qty;\n    else lines.push({ itemId: item.id, name: item.name, category: item.category, qty, unitPaise: item.pricePaise });\n  };\n\n  for (let i = 0; i < Math.max(1, Math.round(covers / 1.6)); i += 1) push(weightedItem(random, mezze), 1);\n  for (let i = 0; i < covers; i += 1) if (random() < 0.88) push(weightedItem(random, bigs), 1);\n  for (let i = 0; i < Math.ceil(covers / 2); i += 1) push(pick(random, sides), 1);\n  for (let i = 0; i < covers; i += 1) if (random() < 0.62) push(pick(random, sweets), 1);\n  for (let i = 0; i < covers; i += 1) if (random() < 1.15) push(weightedItem(random, drinks), 1);\n\n  const gross = lines.reduce((n, l) => n + l.unitPaise * l.qty, 0);\n  // Roughly one bill in nine carries a discount — loyalty, a set menu, or a\n  // manager putting something right.\n  const discount = random() < 0.11 ? pct(gross, between(random, 500, 2000)) : 0;\n  const discounted = gross - discount;\n  const serviceCharge = random() < 0.94 ? pct(discounted, CHARGES.serviceChargeBps) : 0;\n  const taxable = discounted + serviceCharge;\n  const taxTotal = CHARGES.taxComponents.reduce((n, c) => n + pct(taxable, c.bps), 0);\n  const tip = random() < 0.35 ? pct(taxable, between(random, 200, 800)) : 0;\n  const { rounded } = roundToRupee(taxable + taxTotal + tip);\n\n  return {\n    at,\n    covers,\n    lines,\n    gross,\n    discount,\n    serviceCharge,\n    taxTotal,\n    tip,\n    total: rounded,\n    net: discounted,\n    method: weightedPayment(random),\n    /** Table turn, in minutes — fine dining sits far longer than a cafe. */\n    durationMin: between(random, 62, 145),\n    voided: random() < 0.045,\n  };\n}\n\n/**\n * @param {number} days how far back to generate\n * @param {Date}   today the day to end on (exclusive — today is live trading)\n * @returns {Array<{ day, weekday, checks, covers, net, total }>}\n */\nexport function buildHistory(days = 30, today = new Date()) {\n  const out = [];\n  for (let back = days; back >= 1; back -= 1) {\n    const date = new Date(today);\n    date.setDate(date.getDate() - back);\n    date.setHours(0, 0, 0, 0);\n\n    const random = rng(Number(dayKey(date).replace(/-/g, '')));\n    const weight = DAY_WEIGHT[date.getDay()];\n    const target = Math.round(between(random, 22, 34) * weight);\n\n    const checks = [];\n    const hours = Object.keys(HOUR_WEIGHT).map(Number);\n    for (let i = 0; i < target; i += 1) {\n      let hour = pick(random, hours);\n      // Reject-sample so the busy hours actually get the traffic.\n      if (random() > HOUR_WEIGHT[hour] / 1.5) hour = pick(random, [20, 21, 21, 22]);\n      const at = new Date(date);\n      at.setHours(hour, between(random, 0, 59));\n      const covers = between(random, 2, 2) + between(random, 0, 4);\n      checks.push(buildCheck(random, at.getTime(), Math.max(2, covers)));\n    }\n\n    checks.sort((a, b) => a.at e.now() - spec.agoMin * MIN;\n  order.notes = spec.notes || '';\n  for (const [id, qty, seat, modifiers, notes] of spec.lines) {\n    addLine(order, itemById(id), {\n      qty, seat, modifiers: modifiers || [], notes: notes || '',\n    });\n  }\n  for (const line of order.lines) line.addedAt = order.openedAt + MIN;\n  return order;\n}\n\n/**\n * Fire a course and stamp the dockets it produced as having gone in `agoMin`\n * minutes ago. Returns them so the caller can bump each one individually.\n */\nfunction fireAgo(order, courseId, user, agoMin) {\n  const { kots } = fireCourse(order, courseId, user);\n  const firedAt = Date.now() - agoMin * MIN;\n  for (const kot of kots) {\n    kot.firedAt = firedAt;\n    for (const line of order.lines) {\n      if (line.kotId === kot.id) line.firedAt = firedAt;\n    }\n  }\n  return kots;\n}\n\n/**\n * Bump a docket the way a kitchen actually does — a plausible number of minutes\n * after it was fired, not \"just now\". The station performance report reads\n * these gaps, so seeding them carelessly would make the kitchen look broken.\n *\n * @param prepMin minutes on the stove before it reached the pass\n * @param runMin  minutes on the pass before a runner took it, or null to leave\n *                it sitting there — which is what turns the KDS card red\n */\nfunction bump(order, kot, prepMin, runMin = 2) {\n  if (!kot) return kot;\n  kot.status = KOT_STATUS.READY;\n  kot.readyAt = kot.firedAt + prepMin * MIN;\n  kot.servedAt = null;\n  if (runMin != null) {\n    kot.status = KOT_STATUS.SERVED;\n    kot.servedAt = kot.readyAt + runMin * MIN;\n  }\n  for (const line of order.lines) {\n    if (line.kotId !== kot.id) continue;\n    line.status = kot.status;\n    line.readyAt = kot.readyAt;\n    line.servedAt = kot.servedAt;\n  }\n  return kot;\n}\n\nconst at = (kots, station) => kots.find((k) => k.station === station);\n\n/**\n * Bills that were settled earlier today.\n *\n * Without these the Today report opens on a row of zero es), Math.ceil(covers / 2));\n    for (let n = 0; n < covers; n += 1) if (random() < 0.55) push(pick(sweets), 1);\n    for (let n = 0; n < covers; n += 1) if (random() < 1.1) push(pick(drinks), 1);\n\n    const order = open(counter, {\n      table: seats[i], covers, guest: names[i], agoMin: openedAgo,\n      by: random() < 0.5 ? captain : manager,\n      lines,\n    });\n\n    // Fire everything, then bump it through at believable speeds.\n    const kots = fireAgo(order, null, order.captainId === manager.id ? manager : captain,\n      openedAgo - between(3, 7));\n    for (const kot of kots) {\n      const target = { BAR: 5, COLD: 8, TANDOOR: 15, HOT: 17, PASTRY: 10 }[kot.station] || 10;\n      bump(order, kot, between(target - 3, target + 5), between(1, 4));\n    }\n\n    // A handful of bills carry the exceptions a manager wants to see reported.\n    if (i === 3) {\n      order.charges.discount = {\n        mode: 'PCT', value: 10, reason: 'Loyalty / regular guest', approvedBy: manager.name,\n      };\n    }\n    if (i === 7) {\n      const line = order.lines.find((l) => l.status === KOT_STATUS.SERVED);\n      if (line) {\n        line.comp = true;\n        line.compReason = 'Long wait';\n        line.compBy = manager.name;\n      }\n    }\n    if (i === 10) order.charges.serviceCharge = false;\n\n    order.invoice = {\n      number: 858 + i,\n      code: `${NUMBERING.invoicePrefix}-${String(858 + i).padStart(4, '0')}`,\n      at: Date.now() - (closedAgo + 3) * MIN,\n      by: 'Devesh Kamat',\n    };\n    order.status = 'SETTLED';\n    order.closedAt = Date.now() - closedAgo * MIN;\n    order.payments = [{\n      id: `pay_seed_${i}`,\n      method: methods[i],\n      paise: costOrder(order).total,\n      at: order.closedAt,\n      by: 'Devesh Kamat',\n      ref: methods[i] === 'CARD' || methods[i] === 'UPI' ? `Ref ${700431 + i * 97}` : '',\n    }];\n\n    out.push(order);\n  }\n  // Newest first, the way the settled list reads.\n  return out.sort((a, b) => b.closedAt - a.closedAt);\n}\n\n/* ------------------------------------------------------------ state --- */\n\nexport function buildInitialState() {\n  let n = 141;\n  const counter = { next: () => (n += 1) };\n  const orders = [];\n\n  /* --- Table 3 - four covers, starters away, mains still on the pad ------ */\n  {\n    const o = open(counter, {\n      table: 't3', covers: 4, guest: 'Mr Iyer', agoMin: 24,\n      lines: [\n        ['m01', 1, 0], ['m02', 1, 0], ['m05', 1, 0],\n        ['t01', 2, 1], ['n01', 1, 3], ['r01', 2, 0],\n        ['b01', 2, 1], ['s03', 2, 3],\n      ],\n    });\n    bump(o, at(fireAgo(o, 'BEVERAGE', captain, 21), 'BAR'), 4, 1);\n    // Cold larder went in 18 minutes ago against an 8-minute target. This is\n    // the first thing the kitchen display should be shouting about.\n    fireAgo(o, 'STARTER', captain, 18);\n    orders.push(o);\n  }\n\n  /* --- Table 6 - anniversary six, mains in, tandoor dying on the pass ---- */\n  {\n    const o = open(counter, {\n      table: 't6', covers: 6, guest: 'Kapadia · anniversary', agoMin: 46,\n      notes: 'Anniversary — candle with the dessert. No nuts for seat 4.',\n      lines: [\n        ['m10', 1, 0], ['m06', 1, 0], ['m03', 1, 0], ['m09', 1, 0],\n        ['t02', 2, 1, mods('doneness', ['mrare'])],\n        ['t05', 1, 2, mods('doneness', ['medium'])],\n        ['n04', 1, 0, mods('portion', ['sharing'])],\n        ['t07', 1, 4, [], 'No nuts — allergy'],\n        ['r01', 2, 0], ['r04', 3, 0],\n        ['b05', 4, 0], ['b02', 2, 0],\n      ],\n    });\n    bump(o, at(fireAgo(o, 'BEVERAGE', captain, 43), 'BAR'), 5, 2);\n    const starters = fireAgo(o, 'STARTER', captain, 40);\n    bump(o, at(starters, 'COLD'), 7, 3);\n    bump(o, at(starters, 'TANDOOR'), 9, 3);\n    const mains = fireAgo(o, 'MAIN', captain, 26);\n    // Plated eleven minutes ago and still sitting there. The room is one runner\n    // short, and the kitchen display is the only thing that knows.\n    bump(o, at(mains, 'TANDOOR'), 15, null);\n    orders.push(o);\n  }\n\n  /* --- Table 7 - two covers, finished eating, will ask for the bill ------ */\n  {\n    const o = open(counter, {\n      table: 't7', covers: 2, guest: 'Ms D’Souza', agoMin: 84,\n      lines: [\n        ['m02', 1, 0], ['t04', 1, 1], ['n02', 1, 2], ['r02', 1, 0],\n        ['d03', 1, 0], ['b06', 2, 0], ['s04', 2, 0],\n      ],\n    });\n    bump(o, at(fireAgo(o, 'BEVERAGE', captain, 81), 'BAR'), 4, 1);\n    bump(o, at(fireAgo(o, 'STARTER', captain, 78), 'COLD'), 6, 2);\n    const mains = fireAgo(o, 'MAIN', captain, 62);\n    bump(o, at(mains, 'TANDOOR'), 14, 2);\n    bump(o, at(mains, 'HOT'), 16, 3);\n    bump(o, at(fireAgo(o, 'DESSERT', captain, 28), 'PASTRY'), 9, 2);\n    orders.push(o);\n  }\n\n  /* --- Table 9 - corporate eight, bill printed, waiting to settle -------- */\n  {\n    const o = open(counter, {\n      table: 't9', covers: 8, guest: 'Vantage Partners', agoMin: 118,\n      lines: [\n        ['m01', 2, 0], ['m04', 2, 0], ['m07', 2, 0], ['m08', 2, 0],\n        ['t01', 3, 0], ['t03', 2, 0], ['t07', 2, 0], ['n03', 2, 0],\n        ['r01', 3, 0], ['r04', 4, 0],\n        ['d01', 2, 0], ['d04', 3, 0],\n        ['b08', 6, 0], ['s06', 4, 0], ['s05', 5, 0],\n      ],\n    });\n    bump(o, at(fireAgo(o, 'BEVERAGE', captain, 115), 'BAR'), 6, 2);\n    const starters = fireAgo(o, 'STARTER', captain, 112);\n    bump(o, at(starters, 'COLD'), 9, 3);\n    bump(o, at(starters, 'HOT'), 12, 3);\n    bump(o, at(starters, 'TANDOOR'), 11, 2);\n    const mains = fireAgo(o, 'MAIN', captain, 88);\n    bump(o, at(mains, 'TANDOOR'), 17, 4);\n    bump(o, at(mains, 'HOT'), 21, 3);\n    bump(o, at(fireAgo(o, 'DESSERT', captain, 34), 'PASTRY'), 11, 2);\n    o.invoice = {\n      number: 872,\n      code: `${NUMBERING.invoicePrefix}-0872`,\n      at: Date.now() - 5 * MIN,\n      by: 'Devesh Kamat',\n    };\n    orders.push(o);\n  }\n\n  /* --- Terrace G2 - the captain is writing this at the table right now --- */\n  {\n    orders.push(open(counter, {\n      table: 'g2', covers: 2, guest: 'Walk-in', agoMin: 6,\n      lines: [['b01', 1, 1, mods('ice', ['up'])], ['b03', 1, 2], ['m09', 1, 0]],\n    }));\n  }\n\n  /* --- Terrace G5 - mains cooking, dessert written but held back --------- */\n  {\n    const o = open(counter, {\n      table: 'g5', covers: 5, guest: 'Sharma', agoMin: 38,\n      lines: [\n        ['m05', 1, 0], ['m01', 1, 0],\n        ['t06', 1, 2], ['t01', 2, 3], ['n05', 1, 5], ['r03', 2, 0],\n        ['d02', 3, 0], ['d05', 2, 0],\n        ['s01', 3, 0], ['s02', 2, 0],\n      ],\n    });\n    bump(o, at(fireAgo(o, 'BEVERAGE', captain, 35), 'BAR'), 5, 2);\n    bump(o, at(fireAgo(o, 'STARTER', captain, 33), 'COLD'), 8, 2);\n    // Mains went in twelve minutes ago and are still cooking. Dessert stays\n    // held: nobody fires a dessert while the mains are on the grill.\n    fireAgo(o, 'MAIN', captain, 12);\n    orders.push(o);\n  }\n\n  /* --- Rose Room - private twelve, set menu, mains held for the call ----- */\n  {\n    const o = open(counter, {\n      table: 'r1', covers: 12, guest: 'Mehta · engagement dinner', agoMin: 58,\n      notes: 'Set menu. Fire the mains on the captain’s call only.',\n      by: manager,\n      lines: [\n        ['m10', 2, 0], ['m01', 3, 0], ['m03', 3, 0], ['m06', 2, 0], ['m04', 3, 0],\n        ['t02', 4, 0, mods('doneness', ['medium'])],\n        ['n04', 2, 0], ['t07', 3, 0], ['r01', 4, 0], ['r04', 6, 0],\n        ['d01', 4, 0], ['d03', 4, 0],\n        ['b05', 8, 0], ['b07', 6, 0], ['s06', 6, 0],\n      ],\n    });\n    bump(o, at(fireAgo(o, 'BEVERAGE', manager, 55), 'BAR'), 7, 3);\n    bump(o, at(fireAgo(o, 'STARTER', manager, 50), 'COLD'), 12, 4);\n    orders.push(o);\n  }\n\n  /* --- Bar B3 - two in, drinks and a mezze, all served ------------------- */\n  {\n    const o = open(counter, {\n      table: 'b3', covers: 2, guest: 'Bar', agoMin: 28,\n      lines: [['b01', 2, 0], ['b04', 1, 0], ['m01', 1, 0], ['m08', 1, 0]],\n    });\n    const kots = fireAgo(o, null, captain, 26);\n    bump(o, at(kots, 'BAR'), 4, 1);\n    bump(o, at(kots, 'COLD'), 7, 2);\n    bump(o, at(kots, 'HOT'), 11, 2);\n    orders.push(o);\n  }\n\n  const settled = buildSettledToday(counter);\n\n  const today = new Date();\n  return {\n    schema: null, // stamped by the store\n    bootedAt: Date.now(),\n    businessDay: dayKey(today),\n    session: null,\n    orderSeq: n,\n    invoiceSeq: 871 + settled.length,\n    orders,\n    settled,\n    reservations: buildReservations(),\n    /** Items taken off the menu tonight - the \"86 board\". */\n    eightySix: [\n      { itemId: 'b03', by: 'Farid Naqvi', at: Date.now() - 95 * MIN, note: 'Out of fresh egg white' },\n    ],\n    users: DEMO_USERS,\n    /** Price and availability edits made in Settings, keyed by item id. */\n    menuOverrides: {},\n    activity: [\n      { id: uid('a'), at: Date.now() - 5 * MIN, kind: 'BILL', by: 'Devesh Kamat', message: 'Bill printed for Table 9 · INV-0872' },\n      { id: uid('a'), at: Date.now() - 61 * MIN, kind: 'VOID', by: 'Farid Naqvi', message: 'Voided 1 × Barg Fillet on Table 2 — guest changed order' },\n      { id: uid('a'), at: Date.now() - 95 * MIN, kind: '86', by: 'Farid Naqvi', message: 'Saffron Sour marked 86 for the rest of service' },\n    ],\n    history: buildHistory(30, today),\n  };\n}\n\n/**\n * The book.\n *\n * Times are relative to whenever the demo is opened rather than pinned to an\n * evening service, because a demo gets shown at eleven in the morning as often\n * as at eight at night, and a book full of bookings that were all two hours ago\n * makes the whole system look stale. The two parties already seated sit in the\n * past; everything else is still to walk in.\n */\nfunction buildReservations() {\n  const rows = [\n    // [name, covers, minutes from now, table, status, note]\n    ['Kapadia', 6, -46, 't6', 'SEATED', 'Anniversary — candle with dessert'],\n    ['Mehta', 12, -58, 'r1', 'SEATED', 'Engagement dinner, set menu'],\n    ['Ansari', 4, 20, 't5', 'CONFIRMED', 'Window table requested'],\n    ['Dr Pinto', 2, 35, 't1', 'CONFIRMED', ''],\n    ['Bhatia', 8, 50, 't10', 'CONFIRMED', 'One high chair'],\n    ['Lobo', 2, 65, 'g1', 'CONFIRMED', 'Terrace, non-smoking'],\n    ['Rao', 4, 80, 't2', 'CONFIRMED', 'Vegan — no dairy at all'],\n    ['Fernandes', 2, 95, 'g6', 'CONFIRMED', ''],\n  ];\n  return rows.map(([name, covers, offsetMin, tableId, status, note], i) => {\n    // Land each booking on a quarter hour, the way a book is actually kept.\n    const at = new Date(Date.now() + offsetMin * MIN);\n    at.setMinutes(Math.round(at.getMinutes() / 15) * 15, 0, 0);\n    return {\n      id: `res${i + 1}`,\n      name,\n      covers,\n      at: at.getTime(),\n      tableId,\n      status,\n      note,\n      phone: `+91 98${20014477 + i * 13791}`,\n    };\n  });\n}\n\nexport { MENU_ITEMS };\n","/**\n * Hash routing. A billing terminal is often a locked-down browser opened on a\n * local file, where the History API is unavailable — the hash always works.\n *\n * Routes carry the role list that may open them, so an unauthorised screen is\n * never rendered and then hidden; it is never built at all.\n */\n\nconst routes = new Map();\nlet notFound = () => {};\nlet guard = () => true;\nlet current = null;\n\n/** '#/order?table=t4' -> { path: '/order', params: { table: 't4' } } */\nexport function parseHash(hash = window.location.hash) {\n  const raw = String(hash || '').replace(/^#/, '') || '/';\n  const [path, query = ''] = raw.split('?');\n  const params = {};\n  for (const [key, value] of new URLSearchParams(query)) params[key] = value;\n  return { path: path.startsWith('/') ? path : `/${path}`, params };\n}\n\nexport function defineRoute(path, render, meta = {}) {\n  routes.set(path, { render, meta });\n}\n\nexport const setNotFound = (fn) => { notFound = fn; };\n\n/**\n * The guard returns true to allow, or a path string to redirect to. It runs\n * before the view is built, on every navigation.\n */\nexport const setGuard = (fn) => { guard = fn; };\n\nexport function navigate(path, params = {}) {\n  const query = new URLSearchParams(params).toString();\n  const next = `#${path}${query ? `?${query}` : ''}`;\n  if (window.location.hash === next) resolve();\n  else window.location.hash = next;\n}\n\nexport const getRoute = () => current;\n\nfunction resolve() {\n  const route = parseHash();\n  const verdict = guard(route);\n  if (typeof verdict === 'string') {\n    if (verdict !== route.path) { navigate(verdict); return; }\n  } else if (verdict === false) {\n    return;\n  }\n\n  current = route;\n  const entry = routes.get(route.path);\n  if (entry) entry.render(route.params, route);\n  else notFound(route);\n}\n\nexport function startRouter() {\n  window.addEventListener('hashchange', resolve);\n  resolve();\n}\n","/**\n * The layer between the screens and the store.\n *\n * Views never reach into state directly and never mutate it. They read through\n * the selectors here and act through the operations here, which is what makes\n * it possible to say with confidence that a table can only change status in one\n * place, and that every void ends up in the audit log.\n */\n\nimport { getState, update, logActivity, subscribe, flush, resetStore } from 'saba-module:2';\nimport { buildInitialState } from 'saba-module:10';\nimport { MENU_ITEMS, itemById } from 'saba-module:4';\nimport { TABLES, tableById } from 'saba-module:3';\nimport {\n  ROLE_ABILITIES, ROLE_ROUTES, NUMBERING, KOT_STATUS, DEMO_USERS,\n} from 'saba-module:0';\nimport {\n  createOrder, addLine, setLineQty, removeHeldLine, voidLine, compLine,\n  fireCourse, advanceKot, voidKot, reprintKot, orderStage, orderValue, moveLineToSeat,\n} from 'saba-module:8';\nimport { costOrder } from 'saba-module:7';\nimport { serial } from 'saba-module:5';\n\nexport { subscribe, getState, flush };\n\n/**\n * Put the whole evening back to how the demo opened.\n *\n * The signed-in person is carried across deliberately. A fresh state has no\n * session, so a plain reset would drop whoever is presenting back onto the lock\n * screen mid-sentence — which is a worse interruption than whatever they were\n * resetting.\n */\nexport function reset() {\n  const who = session();\n  resetStore(buildInitialState);\n  if (who) update((s) => { s.session = who; });\n  logActivity('SYSTEM', 'Demo reset — service restarted from the opening state');\n  return getState();\n}\n\n/* ------------------------------------------------------------ session --- */\n\nexport const session = () => getState().session;\n\nexport const can = (ability) =>\n  (ROLE_ABILITIES[session()?.role] || []).includes(ability);\n\nexport const mayOpen = (path) =>\n  (ROLE_ROUTES[session()?.role] || []).includes(path);\n\n/** The first screen this role should land on after signing in. */\nexport const homeFor = (role) => (ROLE_ROUTES[role] || ['/floor'])[0];\n\nexport function signIn(user) {\n  update((s) => { s.session = { ...user, since: Date.now() }; });\n  logActivity('SESSION', `${user.name} signed in as ${user.role}`);\n}\n\nexport function signOut() {\n  const who = session()?.name;\n  update((s) => { s.session = null; });\n  if (who) logActivity('SESSION', `${who} signed out`);\n}\n\n/* --------------------------------------------------------------- menu --- */\n\n/**\n * The live carte: seed prices with any Settings edits applied, and anything\n * marked 86 flagged unavailable rather than removed — a captain still needs to\n * see that the sea bass exists so they can tell the guest it has gone.\n */\nexport function menu() {\n  const state = getState();\n  const off = new Set(state.eightySix.map((e) => e.itemId));\n  return MENU_ITEMS.map((item) => {\n    const override = state.menuOverrides[item.id] || {};\n    return {\n      ...item,\n      ...override,\n      available: override.available !== false && !off.has(item.id),\n      eightySixed: off.has(item.id),\n    };\n  });\n}\n\nexport const menuItem = (id) => menu().find((i) => i.id === id) || itemById(id);\n\nexport function setEightySix(itemId, on, note = '') {\n  update((s) => {\n    s.eightySix = s.eightySix.filter((e) => e.itemId !== itemId);\n    if (on) s.eightySix.push({ itemId, by: s.session?.name || '', at: Date.now(), note });\n  });\n  const item = itemById(itemId);\n  logActivity('86', `${item?.name} ${on ? 'marked 86' : 'put back on'}`);\n}\n\nexport function setMenuOverride(itemId, patch) {\n  update((s) => {\n    s.menuOverrides[itemId] = { ...(s.menuOverrides[itemId] || {}), ...patch };\n  });\n}\n\n/* -------------------------------------------------------------- floor --- */\n\nexport const tables = () => TABLES;\n\nexport const openOrders = () => getState().orders;\n\nexport const orderById = (id) => getState().orders.find((o) => o.id === id)\n  || getState().settled.find((o) => o.id === id);\n\nexport const orderForTable = (tableId) =>\n  getState().orders.find((o) => o.tableId === tableId && o.status === 'OPEN');\n\nexport const reservationForTable = (tableId) =>\n  getState().reservations.find(\n    (r) => r.tableId === tableId && r.status === 'CONFIRMED'\n  );\n\n/** Everything the floor plan needs about one table, in one object. */\nexport function tableView(table) {\n  const order = orderForTable(table.id);\n  const reservation = reservationForTable(table.id);\n  const stage = order ? orderStage(order) : (reservation ? 'RESERVED' : 'VACANT');\n  const onPass = order\n    ? order.kots.filter((k) => k.status === KOT_STATUS.READY)\n    : [];\n  const waitingMin = onPass.length\n    ? Math.max(...onPass.map((k) => Math.round((Date.now() - k.readyAt) / 60000)))\n    : 0;\n  return {\n    table,\n    order,\n    reservation,\n    stage,\n    value: order ? orderValue(order) : 0,\n    /** Plated food nobody has collected for more than eight minutes. */\n    alert: waitingMin >= 8,\n    waitingMin,\n  };\n}\n\nexport function seatTable(tableId, { covers, guestName, reservationId }) {\n  const table = tableById(tableId);\n  const user = session();\n  let created = null;\n  update((s) => {\n    s.orderSeq += 1;\n    created = createOrder({\n      number: s.orderSeq, table, covers, guestName, user, reservationId,\n    });\n    s.orders.push(created);\n    if (reservationId) {\n      const reservation = s.reservations.find((r) => r.id === reservationId);\n      if (reservation) reservation.status = 'SEATED';\n    }\n  });\n  logActivity('SEAT', `Table ${table.label} seated — ${covers} covers${guestName ? `, ${guestName}` : ''}`);\n  return created;\n}\n\n/** Move a whole order to a different table, keeping every docket with it. */\nexport function transferTable(orderId, toTableId) {\n  const target = tableById(toTableId);\n  let from = '';\n  update((s) => {\n    const order = s.orders.find((o) => o.id === orderId);\n    if (!order) return;\n    from = order.tableLabel;\n    order.tableId = target.id;\n    order.tableLabel = target.label;\n    order.sectionId = target.sectionId;\n    for (const kot of order.kots) kot.tableLabel = target.label;\n  });\n  logActivity('TRANSFER', `Table ${from} moved to ${target.label}`);\n}\n\n/** Fold one table's order into another — two tables pushed together. */\nexport function mergeTables(sourceOrderId, targetOrderId) {\n  let summary = '';\n  update((s) => {\n    const source = s.orders.find((o) => o.id === sourceOrderId);\n    const target = s.orders.find((o) => o.id === targetOrderId);\n    if (!source || !target) return;\n    summary = `Table ${source.tableLabel} merged into ${target.tableLabel}`;\n    target.lines.push(...source.lines);\n    target.kots.push(...source.kots.map((k) => ({ ...k, orderId: target.id, tableLabel: target.tableLabel })));\n    target.covers += source.covers;\n    target.kotSeq += source.kotSeq;\n    s.orders = s.orders.filter((o) => o.id !== sourceOrderId);\n  });\n  if (summary) logActivity('MERGE', summary);\n}\n\nexport function setCovers(orderId, covers) {\n  update((s) => {\n    const order = s.orders.find((o) => o.id === orderId);\n    if (order) order.covers = Math.max(1, covers);\n  });\n}\n\nexport function setOrderNote(orderId, note) {\n  update((s) => {\n    const order = s.orders.find((o) => o.id === orderId);\n    if (order) order.notes = note;\n  });\n}\n\nexport function setGuestName(orderId, name) {\n  update((s) => {\n    const order = s.orders.find((o) => o.id === orderId);\n    if (order) order.guestName = name;\n  });\n}\n\n/* ------------------------------------------------------------- order --- */\n\nconst mutateOrder = (orderId, fn) => update((s) => {\n  const order = s.orders.find((o) => o.id === orderId);\n  if (order) fn(order, s);\n});\n\nexport const addItem = (orderId, item, options) =>\n  mutateOrder(orderId, (order) => addLine(order, item, options));\n\nexport const changeQty = (orderId, lineId, qty) =>\n  mutateOrder(orderId, (order) => setLineQty(order, lineId, qty));\n\nexport const dropLine = (orderId, lineId) =>\n  mutateOrder(orderId, (order) => removeHeldLine(order, lineId));\n\nexport const setSeat = (orderId, lineId, seat) =>\n  mutateOrder(orderId, (order) => moveLineToSeat(order, lineId, seat));\n\nexport function killLine(orderId, lineId, reason, approver) {\n  let summary = '';\n  mutateOrder(orderId, (order) => {\n    const line = order.lines.find((l) => l.id === lineId);\n    summary = `Voided ${line?.qty} × ${line?.name} on Table ${order.tableLabel} — ${reason}`;\n    voidLine(order, lineId, reason, approver);\n  });\n  logActivity('VOID', summary, { by: approver });\n}\n\nexport function toggleComp(orderId, lineId, reason, approver) {\n  let summary = '';\n  mutateOrder(orderId, (order) => {\n    const line = order.lines.find((l) => l.id === lineId);\n    const turningOn = !line?.comp;\n    summary = `${turningOn ? 'Comped' : 'Un-comped'} ${line?.qty} × ${line?.name} on Table ${order.tableLabel}${turningOn && reason ? ` — ${reason}` : ''}`;\n    compLine(order, lineId, reason, approver);\n  });\n  logActivity('COMP', summary, { by: approver });\n}\n\n/**\n * Send a course to the kitchen. Returns the dockets created so the caller can\n * print them — firing and printing are separate steps on purpose, because a\n * printer being out of paper must not lose the order.\n */\nexport function fire(orderId, courseId) {\n  const user = session();\n  let created = [];\n  mutateOrder(orderId, (order) => {\n    const result = fireCourse(order, courseId, user);\n    created = result.kots;\n  });\n  if (created.length) {\n    const order = orderById(orderId);\n    logActivity('KOT', `${created.length} docket${created.length > 1 ? 's' : ''} fired for Table ${order.tableLabel} (${created.map((k) => k.code).join(', ')})`);\n  }\n  return created;\n}\n\nexport function bumpKot(orderId, kotId, to) {\n  mutateOrder(orderId, (order) => advanceKot(order, kotId, to));\n}\n\nexport function killKot(orderId, kotId, reason, approver) {\n  let summary = '';\n  mutateOrder(orderId, (order) => {\n    const kot = order.kots.find((k) => k.id === kotId);\n    summary = `Docket ${kot?.code} voided on Table ${order.tableLabel} — ${reason}`;\n    voidKot(order, kotId, reason, approver);\n  });\n  logActivity('VOID', summary, { by: approver });\n}\n\nexport function markReprint(orderId, kotId) {\n  mutateOrder(orderId, (order) => reprintKot(order, kotId));\n}\n\n/* -------------------------------------------------------------- bill --- */\n\nexport function setServiceCharge(orderId, on) {\n  mutateOrder(orderId, (order) => { order.charges.serviceCharge = on; });\n  logActivity('BILL', `Service charge ${on ? 'applied' : 'removed'} on order`);\n}\n\nexport function setDiscount(orderId, discount) {\n  mutateOrder(orderId, (order) => { order.charges.discount = discount; });\n  if (discount.mode !== 'NONE') {\n    logActivity('DISCOUNT',\n      `${discount.mode === 'PCT' ? `${discount.value}%` : 'Flat'} discount applied — ${discount.reason || 'no reason given'}`,\n      { by: discount.approvedBy });\n  }\n}\n\nexport function setTip(orderId, paise) {\n  mutateOrder(orderId, (order) => { order.charges.tipPaise = paise; });\n}\n\nexport function setSplit(orderId, split) {\n  mutateOrder(orderId, (order) => { order.split = split; });\n}\n\n/** Print the bill: stamps an invoice number and freezes the table as BILLED. */\nexport function raiseInvoice(orderId) {\n  let invoice = null;\n  update((s) => {\n    const order = s.orders.find((o) => o.id === orderId);\n    if (!order || order.invoice) { invoice = order?.invoice || null; return; }\n    s.invoiceSeq += 1;\n    invoice = {\n      number: s.invoiceSeq,\n      code: serial(NUMBERING.invoicePrefix, s.invoiceSeq, NUMBERING.padding),\n      at: Date.now(),\n      by: s.session?.name || '',\n    };\n    order.invoice = invoice;\n  });\n  const order = orderById(orderId);\n  logActivity('BILL', `Bill printed for Table ${order.tableLabel} · ${invoice?.code}`);\n  return invoice;\n}\n\nexport function addPayment(orderId, payment) {\n  mutateOrder(orderId, (order) => {\n    order.payments.push({\n      id: `pay_${Date.now().toString(36)}`,\n      at: Date.now(),\n      by: getState().session?.name || '',\n      ...payment,\n    });\n  });\n}\n\nexport function removePayment(orderId, paymentId) {\n  mutateOrder(orderId, (order) => {\n    order.payments = order.payments.filter((p) => p.id !== paymentId);\n  });\n}\n\n/**\n * Close the table. The order moves out of the live list into today's settled\n * bills, where the reports pick it up and where it can still be reprinted.\n */\nexport function settleOrder(orderId) {\n  let closed = null;\n  update((s) => {\n    const index = s.orders.findIndex((o) => o.id === orderId);\n    if (index < 0) return;\n    const [order] = s.orders.splice(index, 1);\n    order.status = 'SETTLED';\n    order.closedAt = Date.now();\n    s.settled.unshift(order);\n    closed = order;\n  });\n  if (closed) {\n    const total = costOrder(closed).total;\n    logActivity('SETTLE', `Table ${closed.tableLabel} settled · ${closed.invoice?.code || closed.code} · ₹${(total / 100).toFixed(2)}`);\n  }\n  return closed;\n}\n\n/** Pull a settled bill back onto the floor. Manager only, always logged. */\nexport function reopenOrder(orderId, approver) {\n  let reopened = null;\n  update((s) => {\n    const index = s.settled.findIndex((o) => o.id === orderId);\n    if (index < 0) return;\n    const [order] = s.settled.splice(index, 1);\n    order.status = 'OPEN';\n    order.closedAt = null;\n    s.orders.push(order);\n    reopened = order;\n  });\n  if (reopened) {\n    logActivity('REOPEN', `Bill ${reopened.invoice?.code} reopened on Table ${reopened.tableLabel}`, { by: approver });\n  }\n  return reopened;\n}\n\n/* ------------------------------------------------------ reservations --- */\n\nexport const reservations = () => getState().reservations;\n\nexport function addReservation(row) {\n  update((s) => {\n    s.reservations.push({ id: `res_${Date.now().toString(36)}`, status: 'CONFIRMED', ...row });\n    s.reservations.sort((a, b) => a.at - b.at);\n  });\n  logActivity('BOOKING', `${row.name} booked for ${row.covers}`);\n}\n\nexport function setReservationStatus(id, status) {\n  update((s) => {\n    const reservation = s.reservations.find((r) => r.id === id);\n    if (reservation) reservation.status = status;\n  });\n}\n\nexport function dropReservation(id) {\n  update((s) => { s.reservations = s.reservations.filter((r) => r.id !== id); });\n}\n\n/* -------------------------------------------------------------- misc --- */\n\nexport const users = () => getState().users || DEMO_USERS;\nexport const activity = () => getState().activity;\nexport { costOrder, orderStage, orderValue, tableById };\n","/**\n * Inline icons. Twenty-odd single-stroke glyphs at 24px on a common grid, so\n * they sit together and take their colour from the text around them.\n *\n * They are drawn here rather than pulled from an icon font because this build\n * makes no network requests, and because an icon set that ships as data can be\n * corrected by whoe || $('input,select,textarea,button', modal.querySelector('.modal__body'))\n      || $('.modal__foot .btn', modal);\n    target?.focus();\n  });\n\n  return { close, root: modal };\n}\n\n/** A yes/no question. Resolves true only if the affirmative was chosen. */\nexport function confirm({\n  title, message, confirmLabel = 'Confirm', cancelLabel = 'Cancel', tone = 'primary', body,\n}) {\n  return new Promise((resolve) => {\n    let answered = false;\n    dialog({\n      title,\n      size: 'slim',\n      body: body || h('p', { text: message, style: { color: 'var(--ink-2)', lineHeight: '1.6' } }),\n      actions: [\n        { label: cancelLabel, onclick: (close) => close() },\n        {\n          label: confirmLabel, tone, autofocus: true,\n          onclick: (close) => { answered = true; close(); },\n        },\n      ],\n      onclose: () => resolve(answered),\n    });\n  });\n}\n\n/** Ask for a single value. Resolves the string, or null if cancelled. */\nexport function prompt({\n  title, subtitle, label, value = '', placeholder = '', type = 'text',\n  confirmLabel = 'Save', hint,\n}) {\n  return new Promise((resolve) => {\n    let result = null;\n    const input = h(`input.input${type === 'textarea' ? '' : ''}`, {\n      type: type === 'textarea' ? 'text' : type, value, placeholder,\n    });\n    const field = type === 'textarea'\n      ? h('textarea.textarea', { placeholder, text: value })\n      : input;\n\n    const submit = (close) => { result = field.value.trim(); close(); };\n\n    field.addEventListener('keydown', (event) => {\n      if (event.key === 'Enter' && type !== 'textarea') {\n        event.preventDefault();\n        result = field.value.trim();\n        handle.close();\n      }\n    });\n\n    const handle = dialog({\n      title,\n      subtitle,\n      size: 'slim',\n      body: h('div.field', {}, [\n        label ? h('label.field__label', { text: label }) : null,\n        field,\n        hint ? h('p.setting__hint', { text: hint }) : null,\n nt) => {\n      if (/^\\d$/.test(event.key)) press(event.key);\n      else if (event.key === 'Backspace') press('del');\n    };\n    document.addEventListener('keydown', onKey);\n\n    const handle = dialog({\n      title,\n      subtitle: subtitle || 'A manager must approve this.',\n      size: 'slim',\n      body: h('div.grid', { style: { gap: '16px', justifyItems: 'center' } }, [\n        wrap,\n        keypad,\n        h('p.lock__note', {\n          style: { textAlign: 'center' },\n          text: `Demo PINs — ${eligible.map((u) => `${u.name.split(' ')[0]} ${u.pin}`).join(' · ')}`,\n        }),\n      ]),\n      onclose: () => {\n        document.removeEventListener('keydown', onKey);\n        resolve(approved);\n      },\n    });\n  });\n}\n\n/* -------------------------------------------------------- primitives --- */\n\nexport const chip = (text, tone, opts = {}) =>\n  h(`span.chip${tone ? `.chip--${tone}` : ''}`, opts, [\n    opts.dot ? h('span.chip__dot') : null,\n    opts.icon ? icon(opts.icon, { size: 13 }) : null,\n    text,\n  ]);\n\nexport const caps = (text) => h('p.u-caps', { text });\n\nexport const rule = () => h('div.rule', {}, h('span.rule__mark'));\n\nexport function field(label, control, hint) {\n  return h('div.field', {}, [\n    h('label.field__label', { text: label }),\n    control,\n    hint ? h('p.setting__hint', { text: hint }) : null,\n  ]);\n}\n\nexport function setting(name, hint, control) {\n  return h('div.setting', {}, [\n    h('div.setting__text', {}, [\n      h('div.setting__name', { text: name }),\n      hint ? h('div.setting__hint', { text: hint }) : null,\n    ]),\n    h('div.setting__control', {}, control),\n  ]);\n}\n\nexport function toggle(checked, onchange) {\n  const input = h('input', { type: 'checkbox', checked, onchange: (e) => onchange(e.target.checked) });\n  return h('label.switch', {}, [input, h('span.switch__track')]);\n}\n\nexport function segmented(options, selected, onpick, opts = {}) {\n  return h('div.segment
