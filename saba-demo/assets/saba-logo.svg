<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Saba">
  <title>Saba</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A96A" />
      <stop offset=".45" stop-color="#A9803F" />
      <stop offset="1" stop-color="#C9A96A" />
    </linearGradient>
    <radialGradient id="field" cx=".5" cy=".38" r=".72">
      <stop offset="0" stop-color="#FFFDF8" />
      <stop offset="1" stop-color="#F6EEE0" />
    </radialGradient>

    <!-- One tile of the border lattice, drawn upright then rotated into place. -->
    <g id="motif">
      <g transform="translate(200 31)">
        <path d="M21 0 L21 -19 L0 -19 Z M-21 0 L-21 -19 L0 -19 Z"
              fill="url(#gold)" opacity=".16" />
        <path d="M21 0 L21 19 L0 19 Z M-21 0 L-21 19 L0 19 Z"
              fill="url(#gold)" opacity=".16" />
        <path d="M0 -19 L21 0 L0 19 L-21 0 Z"
              fill="none" stroke="url(#gold)" stroke-width="1.7" />
        <path d="M0 -10.5 L11.5 0 L0 10.5 L-11.5 0 Z"
              fill="none" stroke="url(#gold)" stroke-width="1.1" />
        <path d="M0 -4.2 L4.6 0 L0 4.2 L-4.6 0 Z" fill="url(#gold)" />
      </g>
    </g>
  </defs>

  <circle cx="200" cy="200" r="197" fill="url(#field)" />
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#gold)" stroke-width="2.4" />
  <circle cx="200" cy="200" r="188" fill="none" stroke="url(#gold)" stroke-width="1.2" />

  <g>
      <use href="#motif" transform="rotate(0.0000 200 200)" />
      <use href="#motif" transform="rotate(13.8462 200 200)" />
      <use href="#motif" transform="rotate(27.6923 200 200)" />
      <use href="#motif" transform="rotate(41.5385 200 200)" />
      <use href="#motif" transform="rotate(55.3846 200 200)" />
      <use href="#motif" transform="rotate(69.2308 200 200)" />
      <use href="#motif" transform="rotate(83.0769 200 200)" />
      <use href="#motif" transform="rotate(96.9231 200 200)" />
      <use href="#motif" transform="rotate(110.7692 200 200)" />
      <use href="#motif" transform="rotate(124.6154 200 200)" />
      <use href="#motif" transform="rotate(138.4615 200 200)" />
      <use href="#motif" transform="rotate(152.3077 200 200)" />
      <use href="#motif" transform="rotate(166.1538 200 200)" />
      <use href="#motif" transform="rotate(180.0000 200 200)" />
      <use href="#motif" transform="rotate(193.8462 200 200)" />
      <use href="#motif" transform="rotate(207.6923 200 200)" />
      <use href="#motif" transform="rotate(221.5385 200 200)" />
      <use href="#motif" transform="rotate(235.3846 200 200)" />
      <use href="#motif" transform="rotate(249.2308 200 200)" />
      <use href="#motif" transform="rotate(263.0769 200 200)" />
      <use href="#motif" transform="rotate(276.9231 200 200)" />
      <use href="#motif" transform="rotate(290.7692 200 200)" />
      <use href="#motif" transform="rotate(304.6154 200 200)" />
      <use href="#motif" transform="rotate(318.4615 200 200)" />
      <use href="#motif" transform="rotate(332.3077 200 200)" />
      <use href="#motif" transform="rotate(346.1538 200 200)" />
  </g>

  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#gold)" stroke-width="2.2" />
  <circle cx="200" cy="200" r="143" fill="none" stroke="url(#gold)" stroke-width="1" />
  <circle cx="200" cy="200" r="142" fill="url(#field)" />

  <!-- Rose, sitting in the gap the wordmark's ascender leaves open. -->
  <g transform="translate(197 170) scale(1.02)">
    <path d="M0 22 C-1 14 -4 6 -9 1" fill="none" stroke="#4F6B52" stroke-width="2.1"
          stroke-linecap="round" />
    <path d="M-2 12 C-9 12 -14 8 -15 2 C-9 1 -3 5 -2 12 Z" fill="#4F6B52" />
    <path d="M1 17 C7 18 12 15 14 9 C8 7 2 10 1 17 Z" fill="#5C7A5F" />
    <circle cx="0" cy="-6" r="14" fill="url(#gold)" />
    <path d="M0 -6 m-9 0 a9 9 0 1 1 9 9" fill="none" stroke="#F6EEE0"
          stroke-width="1.5" stroke-linecap="round" />
    <path d="M0 -6 m-4.6 0 a4.6 4.6 0 1 0 4.6 -4.6" fill="none" stroke="#F6EEE0"
          stroke-width="1.4" stroke-linecap="round" />
    <path d="M-13 -12 C-7 -18 5 -19 11 -13" fill="none" stroke="#F6EEE0"
          stroke-width="1.2" stroke-linecap="round" opacity=".8" />
  </g>

  <text x="200" y="253" text-anchor="middle" fill="#7E1B22"
        font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif"
        font-size="112" font-style="italic" letter-spacing="-1">Saba</text>
</svg>
