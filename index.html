<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#241B16" />
    <meta
      name="description"
      content="Billing and point-of-sale counter for The Baruch Cafe."
    />
    <title>The Baruch Cafe POS</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/logo.jpg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/app.css" />
  </head>

  <body>
    <!-- Shown until the app boots, and reused for fatal start-up errors. -->
    <div id="boot" class="boot">
      <div class="boot__inner">
        <img class="boot__logo" src="assets/logo.jpg" alt="" />
        <p class="boot__text">Opening the counter…</p>
      </div>
    </div>

    <header id="shell" hidden></header>
    <main id="view" class="view"></main>

    <!-- Receipts are rendered here for printing; hidden on screen. -->
    <div id="printArea" class="printarea" aria-hidden="true"></div>

    <noscript>
      <div class="boot__inner">
        <p class="boot__text">
          This billing counter needs JavaScript switched on to run.
        </p>
      </div>
    </noscript>

    <!--
      Guard for the most common support question. When this page is opened by
      double-clicking it, the browser gives it no origin, which blocks both
      JavaScript modules and IndexedDB — the app would show a blank screen and
      could not save a single sale. This is a classic (non-module) script, so it
      still runs in that situation and can explain what to do.
    -->
    <script>
      (function () {
        if (window.location.protocol !== 'file:') return;

        document.documentElement.innerHTML =
          '<head><meta charset="utf-8"><title>Open this from localhost</title></head>' +
          '<body style="margin:0;background:#f7f2e9;color:#241b16;' +
          'font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;">' +
          '<div style="max-width:34rem;margin:0 auto;padding:3rem 1.5rem;">' +
          '<img src="assets/logo.jpg" alt="" style="width:88px;height:88px;' +
          'border-radius:50%;display:block;margin-bottom:1.75rem;">' +
          '<h1 style="font-size:1.5rem;margin:0 0 1rem;">Almost there</h1>' +
          '<p style="margin:0 0 1rem;">This page was opened directly from a ' +
          'folder. Browsers do not allow a page opened that way to run its ' +
          'code or save any data, so the billing counter cannot start.</p>' +
          '<p style="margin:0 0 0.5rem;"><strong>To open it properly:</strong></p>' +
          '<ul style="margin:0 0 1.5rem;padding-left:1.25rem;">' +
          '<li>Go to the app folder.</li>' +
          '<li>Double-click <code style="background:#e8e0d1;padding:0.1em 0.4em;' +
          'border-radius:4px;">start.bat</code> on Windows, or <code ' +
          'style="background:#e8e0d1;padding:0.1em 0.4em;border-radius:4px;">' +
          'start.command</code> on a Mac.</li>' +
          '<li>Leave the small black window open, and use the browser tab it ' +
          'opens at <strong>http://localhost:8000</strong>.</li></ul>' +
          '<p style="margin:0;padding-top:1.25rem;border-top:1px solid #d8cebb;' +
          'color:#6b5d4f;font-size:0.9rem;">For everyday use in the cafe, host ' +
          'the app on GitHub Pages instead and open it like any other website. ' +
          'Setup steps are in README.md.</p></div></body>';
      })();
    </script>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
